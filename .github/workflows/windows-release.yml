name: After Rain — executável para Windows
run-name: After Rain ${{ github.ref_name }} — Windows x64

on:
  workflow_dispatch:
  push:
    branches: ['title-screen-0.5']
    paths: ['package.json']
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $packageVersion do executável."
          }

      - name: Verificar TypeScript e sistemas
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o executável portátil
        run: npm run desktop:win -- --publish never

      - name: Calcular a verificação de integridade
        shell: pwsh
        run: |
          $checksums = Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item "docs/cenarios/LEIA-$version.md" release/LEIA.md

      - name: Disponibilizar para download na execução
        uses: actions/upload-artifact@v4
        with:
          name: After-Rain-${{ github.ref_name }}-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/LEIA.md
          if-no-files-found: error
          retention-days: 30

      - name: Publicar a versão validada
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/title-screen-0.5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release create $tag --draft --target $env:RELEASE_COMMIT --repo $env:RELEASE_REPOSITORY --title "After Rain $tag — mapas, água e sombras (Windows x64)" --notes-file "docs/cenarios/NOTAS-$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @((Get-ChildItem release/*.exe).FullName) + @('release/SHA256SUMS.txt', 'release/LEIA.md')
          gh release upload $tag @assets --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
