name: After Rain — executável para Windows
run-name: After Rain ${{ github.ref_name }} — Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $packageVersion do executável."
          }

      - name: Verificar TypeScript e sistemas
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o executável portátil
        run: npm run desktop:win -- --publish never

      - name: Calcular a verificação de integridade
        shell: pwsh
        run: |
          $checksums = Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Disponibilizar para download na execução
        uses: actions/upload-artifact@v4
        with:
          name: After-Rain-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar uma versão quando uma tag for enviada
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $notes = @'
          After Rain 0.6.1 — mochila de 30 espaços e itens arrastáveis.

          - Inventário em grade, com pilhas, quantidades, espaços vazios e descrição do item, mantendo o visual Jardim leve.
          - Arraste itens da mochila para os nove slots da barra rápida. Também é possível clicar no item e depois no destino, ou usar Tab e Enter.
          - Regador recolhido na casa aparece na mochila; sementes e ferramentas equipadas usam suas ações normais.
          - Atalhos acompanham as quantidades reais, sem duplicar ou consumir o estoque. Configuração preservada ao salvar/recarregar.
          - Botão direito ou Delete remove um atalho; soltar outro item substitui o anterior.
          - Mochila inicial com 30 espaços para pilhas, não 30 unidades totais. Itens iguais compartilham um espaço.

          Preserva os saves e as melhorias da 0.6.0: missões arrastáveis, mapa real, localização temporária e coletas únicas. O save continua em %APPDATA%\Depois da Chuva.

          Validação: TypeScript, 172 testes de sistemas, build e Chromium. Testes de arrastar, atribuir por teclado, substituir, remover, esgotar estoque, salvar/recarregar e regressão das coletas nas duas ordens.

          Portátil para Windows 11 x64, gerado em Windows. Baixe o .exe e abra com dois cliques. Não exige Node.js ou servidor. Pacote sem assinatura digital. Execução interativa no Windows 11 não testada neste ambiente Linux. SHA256SUMS.txt permite conferir a integridade.
          '@
          $notes | Set-Content -Encoding utf8NoBOM release/NOTAS.txt
          $assets = @((Get-ChildItem release/*.exe).FullName) + @('release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --repo $env:RELEASE_REPOSITORY --title "After Rain $env:RELEASE_TAG — Windows x64" --notes-file release/NOTAS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
