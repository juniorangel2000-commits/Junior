name: After Rain — executável para Windows
run-name: After Rain ${{ github.ref_name }} — Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $packageVersion do executável."
          }

      - name: Verificar TypeScript e sistemas
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o executável portátil
        run: npm run desktop:win -- --publish never

      - name: Calcular a verificação de integridade
        shell: pwsh
        run: |
          $checksums = Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Disponibilizar para download na execução
        uses: actions/upload-artifact@v4
        with:
          name: After-Rain-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar uma versão quando uma tag for enviada
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $notes = @'
          After Rain 0.6.0 — HUD Jardim leve e melhorias de exploração.

          - HUD em creme, madeira clara e verde sálvia.
          - Nove slots menores, inicialmente vazios; clique para escolher, botão direito para trocar ou esvaziar. Configuração salva na partida.
          - Missões arrastáveis com posição lembrada, botão X e reabertura.
          - M exibe o cenário real completo das áreas jogáveis e a posição exata do personagem; dentro da casa, mostra o interior identificado.
          - Nome do local por 10 segundos ao mudar de área; controles na barra superior; cartão Ao ar livre removido.
          - Regador e pacote de 7 sementes recolhíveis uma única vez na casa. As duas ordens de coleta foram testadas com salvamento e recarga após cada objeto.
          - Personalização da casa somente por H; E preserva coleta, entrada, saída e cama.

          Mantém os sistemas, artes e partidas anteriores da 0.5.1. O save continua em %APPDATA%\Depois da Chuva.

          Aplicativo portátil para Windows 11 x64, gerado em Windows. Baixe o .exe e abra com dois cliques; não exige Node.js ou servidor. Pacote sem assinatura digital.

          Validação: TypeScript, 167 testes de sistemas, build e aceitação em Chromium. A execução interativa no Windows 11 não foi testada neste ambiente Linux. SHA256SUMS.txt permite verificar o download.
          '@
          $notes | Set-Content -Encoding utf8NoBOM release/NOTAS.txt
          $assets = @((Get-ChildItem release/*.exe).FullName) + @('release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --repo $env:RELEASE_REPOSITORY --title "After Rain $env:RELEASE_TAG — Windows x64" --notes-file release/NOTAS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
