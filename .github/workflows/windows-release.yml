name: After Rain — executável para Windows
run-name: After Rain ${{ github.ref_name }} — Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $packageVersion do executável."
          }

      - name: Verificar TypeScript e sistemas
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o executável portátil
        run: npm run desktop:win -- --publish never

      - name: Calcular a verificação de integridade
        shell: pwsh
        run: |
          $checksums = Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Disponibilizar para download na execução
        uses: actions/upload-artifact@v4
        with:
          name: After-Rain-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar uma versão quando uma tag for enviada
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $notes = @'
          After Rain 0.7.1 — ícones em pixel art, som na barra e missões livres.

          - Novo botão Música na barra superior. O painel Som do vale reúne volumes de música e efeitos, silêncio geral, prévia de efeito e restauração dos volumes.
          - Nove ilustrações originais em pixel art para a barra, seguindo a paleta e a arte da fazenda.
          - Aba Missões minimizada arrastável, com posição própria salva, independente da janela aberta.
          - Arrastar a aba não a abre por engano. Clique, Enter e Espaço abrem normalmente; posições permanecem dentro da tela ao redimensionar.
          - Selecionar um slot vazio deixa o personagem de mãos vazias para coletar e interagir. A mochila continua em I e na barra.
          - Tela inicial no estilo da HUD: madeira, painel creme e ícones em pixel art, com o cenário real ao fundo.
          - Abertura com raios ocasionais, trilha chuvosa original e botão para ouvir a chuva sem sair do início.
          - Saves, mochila de 30 espaços, nove slots e recompensas preservados.

          Validação: TypeScript, 181 testes, build e Chromium. Testes de arraste nas duas formas das missões, posição após reload, teclado, limites da tela, botões da barra, áudio e tela cheia.

          Versão para navegador de computador: https://after-rain-junior-desktop.astralpeach256.chatgpt.site (acesso pela conta do ChatGPT). Save do navegador é separado do executável.

          Portátil para Windows 11 x64, gerado em Windows. Baixe o .exe e abra com dois cliques. Não exige Node.js ou servidor. Pacote sem assinatura digital. Execução interativa no Windows 11 não testada neste ambiente Linux. SHA256SUMS.txt permite conferir a integridade.
          '@
          $notes | Set-Content -Encoding utf8NoBOM release/NOTAS.txt
          $assets = @((Get-ChildItem release/*.exe).FullName) + @('release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --repo $env:RELEASE_REPOSITORY --title "After Rain $env:RELEASE_TAG — Windows x64" --notes-file release/NOTAS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
