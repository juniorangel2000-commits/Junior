name: After Rain — executável para Windows
run-name: After Rain ${{ github.ref_name }} — Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $packageVersion do executável."
          }

      - name: Verificar TypeScript e sistemas
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o executável portátil
        run: npm run desktop:win -- --publish never

      - name: Calcular a verificação de integridade
        shell: pwsh
        run: |
          $checksums = Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Disponibilizar para download na execução
        uses: actions/upload-artifact@v4
        with:
          name: After-Rain-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar uma versão quando uma tag for enviada
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $notes = @'
          After Rain 0.7.0 — Fazenda aconchegante, música e sons.

          - HUD completa na opção 02: molduras de madeira, painéis claros, relógio à direita e menus combinando com a mochila.
          - Mochila de 30 espaços para pilhas e nove slots configuráveis por arraste; missões com arraste, posição salva e X.
          - Trilha instrumental original em loop e efeitos de passos, coleta, ferramentas, plantio, rega, fabricação, construção, portas e botões. Funcionam offline.
          - Volumes independentes para música e efeitos e opção de silenciar no menu de pausa. Preferências salvas; áudio suspenso quando a janela perde o foco.
          - Ctrl + Alt entra e sai da tela cheia, inclusive nos menus.
          - Tela inicial sempre começa com chuva animada, inclusive ao voltar da partida ou da criação. É possível pausar o fundo nesta visita.

          Preserva os saves, o mapa real completo e as coletas únicas de regador e sete sementes. O save continua em %APPDATA%\Depois da Chuva. O áudio começa após a primeira interação, respeitando o navegador.

          Validação: TypeScript, 178 testes, build e Chromium. Inclui as duas ordens de coleta com save/reload após cada objeto; mapa interior/exterior, inventário, arraste de missões, áudio, volumes, Ctrl + Alt e chuva automática.

          Portátil para Windows 11 x64, gerado em Windows. Baixe o .exe e abra com dois cliques. Não exige Node.js ou servidor. Pacote sem assinatura digital. Execução interativa no Windows 11 não testada neste ambiente Linux. SHA256SUMS.txt permite conferir a integridade.
          '@
          $notes | Set-Content -Encoding utf8NoBOM release/NOTAS.txt
          $assets = @((Get-ChildItem release/*.exe).FullName) + @('release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --repo $env:RELEASE_REPOSITORY --title "After Rain $env:RELEASE_TAG — Windows x64" --notes-file release/NOTAS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
