name: After Rain — executável para Windows
run-name: After Rain ${{ github.ref_name }} — Windows x64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $packageVersion do executável."
          }

      - name: Verificar TypeScript e sistemas
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o executável portátil
        run: npm run desktop:win -- --publish never

      - name: Calcular a verificação de integridade
        shell: pwsh
        run: |
          $checksums = Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Disponibilizar para download na execução
        uses: actions/upload-artifact@v4
        with:
          name: After-Rain-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar uma versão quando uma tag for enviada
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $notes = @'
          After Rain 0.5.0 — casa, descanso e interface atualizada.

          Inclui todas as alterações feitas desde a versão 0.4.0:

          - Novo nome After Rain e abertura chuvosa com garoa, neblina, câmera suave e controle para pausar o fundo.
          - Nova sprite da casa no estilo atual do mapa, com o caminho de acesso alinhado à porta.
          - Interior personalizável: cama, mesa, cadeira, estante, tapete, planta e acabamentos de piso/parede.
          - Cama para dormir à noite e avançar até as 08:00, incluindo o crescimento dos cultivos regados.
          - Barra superior retrátil: passe o mouse no centro superior para revelar a seta, ou use o botão direito no cenário.
          - Inventário, mapa, fabricação, construção, salvar e opções na barra; os menus pausam a simulação.
          - Missões com X para fechar e botão para reabrir, com preferência lembrada localmente.
          - Painel de dia, hora e recursos reduzido para 210×62 pixels.
          - Placas externas removidas e nome da Lia sem fundo.
          - Menu administrativo por senha com busca e concessão dos 19 itens reais, minimizável para testes.

          Mantém as três regiões, as artes de terreno, recursos e personagem, a criação de personagem, o cultivo, a fabricação e a construção. Móveis, acabamentos e posição dentro da casa ficam salvos; partidas anteriores continuam compatíveis. A senha do administrador foi entregue separadamente ao responsável pelo projeto.

          O local e o formato dos saves continuam os mesmos, apesar da mudança de nome: %APPDATA%\Depois da Chuva. O save do aplicativo continua separado do save do navegador.

          O vídeo do Flow ainda não foi fornecido; a abertura usa o próprio cenário animado do jogo. O próximo polimento visual da HUD será uma etapa posterior a este pacote.

          Aplicativo portátil para Windows 10/11 de 64 bits, gerado em Windows.
          Baixe o arquivo .exe desta versão e abra com dois cliques. Não exige Node.js ou servidor.
          O pacote não possui assinatura digital. A geração em Windows e os checks automatizados não substituem um teste manual de jogo no Windows 11.

          SHA256SUMS.txt permite conferir a integridade do download.
          '@
          $notes | Set-Content -Encoding utf8NoBOM release/NOTAS.txt
          $assets = @((Get-ChildItem release/*.exe).FullName) + @('release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --repo $env:RELEASE_REPOSITORY --title "After Rain $env:RELEASE_TAG — Windows x64" --notes-file release/NOTAS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
