name: After Rain — executável para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Gerar pacote Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "A tag $env:RELEASE_TAG não corresponde à versão $packageVersion do executável."
          }

      - name: Verificar TypeScript e sistemas
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o executável portátil
        run: npm run desktop:win -- --publish never

      - name: Calcular a verificação de integridade
        shell: pwsh
        run: |
          $checksums = Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt

      - name: Disponibilizar para download na execução
        uses: actions/upload-artifact@v4
        with:
          name: After-Rain-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar uma versão quando uma tag for enviada
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $notes = @'
          After Rain — nova identidade e abertura chuvosa.

          O jogo passa a se chamar After Rain. A nova tela inicial apresenta a propriedade em uma atmosfera pós-apocalíptica, com garoa, neblina, câmera suave, controle para pausar o fundo e suporte a vídeo local em loop.

          Mantém as artes de terreno, recursos e personagem da versão 0.4.0, as três regiões, a personalização, o cultivo, a fabricação e a construção.

          O local e o formato dos saves continuam os mesmos, apesar da mudança de nome.

          Aplicativo portátil para Windows 10/11 de 64 bits, gerado em Windows.
          Baixe o arquivo .exe desta versão e abra com dois cliques. Não exige Node.js ou servidor.
          O pacote não possui assinatura digital. O save do aplicativo fica em %APPDATA%\Depois da Chuva.

          SHA256SUMS.txt permite conferir a integridade do download.
          '@
          $notes | Set-Content -Encoding utf8NoBOM release/NOTAS.txt
          $assets = @((Get-ChildItem release/*.exe).FullName) + @('release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @assets --verify-tag --repo $env:RELEASE_REPOSITORY --title "After Rain $env:RELEASE_TAG — Windows x64" --notes-file release/NOTAS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
