name: After Rain Native - Windows x64
on:
  push:
    branches: [native/cpp-foundation]
    paths:
      - 'godot-teste/**'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SCons
        run: python -m pip install scons
      - name: Compile native extension
        shell: pwsh
        run: ./godot-teste/native/build-windows.ps1
      - name: Download Godot 4.4 Standard
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_win64.exe.zip'
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
      - name: Import project and smoke test
        shell: pwsh
        run: |
          $engine = Get-ChildItem godot -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if (-not $engine) { throw 'Godot console executable missing.' }
          & $engine.FullName --headless --path godot-teste --editor --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeLog = Join-Path $env:RUNNER_TEMP 'native-smoke.log'
          & $engine.FullName --headless --path godot-teste --verbose --log-file $smokeLog --script res://tests/native_smoke.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $smokeLog)) { throw 'Smoke log missing.' }
          foreach ($marker in @('NATIVE_SMOKE_OK','NATIVE_ANIMALS_SMOKE_OK','NATIVE_HOME_SMOKE_OK','NATIVE_BUILD_SMOKE_OK','NATIVE_RESOURCE_SMOKE_OK','NATIVE_INVENTORY_SMOKE_OK','NATIVE_FARM_SMOKE_OK')) {
            if (-not (Select-String -Path $smokeLog -Pattern $marker -SimpleMatch -Quiet)) { throw "Missing smoke marker: $marker" }
          }
          if (Select-String -Path $smokeLog -Pattern 'SCRIPT ERROR:|^ERROR:' -Quiet) { throw 'Godot script/runtime error during smoke test.' }
      - uses: actions/upload-artifact@v6
        with:
          name: native-extension-windows-x64
          path: |
            godot-teste/bin/after_rain_native.dll
            godot-teste/after_rain.gdextension
          if-no-files-found: error
      - name: Install Godot 4.4 Windows export templates
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz'
          Invoke-WebRequest -Uri $url -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $dest = Join-Path $env:APPDATA 'Godot/export_templates/4.4.stable'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item templates/templates/windows_debug_x86_64.exe $dest -Force
          if (Test-Path templates/templates/windows_debug_x86_64_console.exe) {
            Copy-Item templates/templates/windows_debug_x86_64_console.exe $dest -Force
          }
      - name: Export Windows x64 debug build
        shell: pwsh
        run: |
          $engine = Get-ChildItem godot -Recurse -Filter '*_console.exe' | Select-Object -First 1
          $out = Join-Path $env:GITHUB_WORKSPACE 'native-dist'
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Join-Path $out 'After-Rain-Native-V0.09.1.exe'
          & $engine.FullName --headless --path godot-teste --export-debug 'Windows Desktop' $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @($exe, (Join-Path $out 'After-Rain-Native-V0.09.1.pck'))) {
            if (-not (Test-Path $file)) { throw "Missing export: $file" }
          }
          $dll = Get-ChildItem $out -Recurse -Filter 'after_rain_native.dll'
          if (-not $dll) { throw 'Native DLL missing from export.' }
      - name: Smoke test exported game
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'native-dist'
          $exe = Join-Path $out 'After-Rain-Native-V0.09.1.exe'
          $log = Join-Path $env:RUNNER_TEMP 'after-rain-export-smoke.log'
          $p = Start-Process -FilePath $exe -ArgumentList "--headless --log-file `"$log`" -- --native-export-smoke" -WorkingDirectory $out -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'Export smoke timed out.' }
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Export exit code: $($p.ExitCode)" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'SCRIPT ERROR:|^ERROR:' -Quiet)) { throw 'Godot script/runtime error in exported game.' }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern 'NATIVE_EXPORT_SMOKE_OK' -Quiet)) {
            throw 'Export smoke marker not found.'
          }
      - name: Package portable build
        shell: pwsh
        run: |
          Copy-Item godot-teste/LEIA-NATIVE-WINDOWS.md native-dist/LEIA.md
          Compress-Archive -Path native-dist/* -DestinationPath After-Rain-Native-V0.09.1-Windows-x64.zip
          $hash = (Get-FileHash After-Rain-Native-V0.09.1-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  After-Rain-Native-V0.09.1-Windows-x64.zip" | Set-Content -Encoding utf8NoBOM SHA256SUMS-native.txt
      - uses: actions/upload-artifact@v6
        with:
          name: After-Rain-Native-V0.09.1-Windows-x64
          path: |
            After-Rain-Native-V0.09.1-Windows-x64.zip
            SHA256SUMS-native.txt
          if-no-files-found: error
          retention-days: 30
