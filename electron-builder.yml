appId: br.depoisdachuva.jogo
productName: After Rain
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: desktop/resources
files:
  - dist/**/*
  - desktop/*.cjs
  - desktop/resources/icon.png
  - package.json
  - '!node_modules/**/*'
win:
  target:
    - target: portable
      arch:
        - x64
  icon: desktop/resources/icon.ico
  signAndEditExecutable: false
  artifactName: After-Rain-Editor-Preview-Windows-x64.exe
portable:
  requestExecutionLevel: user
linux:
  target: dir
  icon: desktop/resources/icon.png
  category: Game
